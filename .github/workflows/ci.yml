name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # The tests start a real PostgreSQL through Testcontainers; the runner's Docker provides it.
      - name: Build and test
        run: ./mvnw -B verify
